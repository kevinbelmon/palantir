# Plantilla del grafo de dominio — /sdd-scan genera graph/domain.yaml con esta estructura.
# El grafo es la fuente de routing de contexto: ante una tarea, el agente identifica
# acá el dominio afectado y lee SOLO los archivos listados en `files`.

meta:
  generated_by: sdd-scan
  commit: null # SHA del commit contra el que se generó (drift tracking)
  updated: YYYY-MM-DD

domains: {}
# Ejemplo de dominio:
#   auth:
#     description: "Autenticación y sesiones"
#     entities: [User, Session]
#     services: [useAuth, tokenService]
#     components: [LoginForm, SessionGuard]
#     storage: localStorage | api | db
#     features: [001-login]          # ids de specs/_registry/features.yaml
#     depends_on: []                 # otros dominios
#     contract: contracts/auth.openapi.yaml   # (opcional) spec del contrato HTTP del dominio
#     files:                         # lo que EXISTE — el routing lee solo esto
#       types: [src/types/auth.ts]
#       services: [src/services/token.ts]
#       components: [src/components/auth/]
#       tests: [src/services/token.test.ts]
#     planned:                       # lo que una feature abierta VA a crear
#       services: [src/services/refresh.ts]
#
# `files` y `planned` tienen las mismas claves y significados opuestos en el tiempo.
# La separacion existe porque el routing solo puede leer lo que esta en disco, y
# porque el auditor exige que todo lo de `files` exista: una ruta futura ahi da
# rojo desde /sdd-generate hasta /sdd-implement, en cada feature, siempre.
# /sdd-review mueve a `files` lo de `planned` que ya exista al cerrar.
#
# `contract:` (opcional) apunta al spec OpenAPI del contrato HTTP del dominio — la forma
# legible por maquina de su interfaz publica cuando esa interfaz es HTTP. Es capa C: local
# al repo, se commitea con el codigo, nunca se copia a otro repo. Entre codebases se
# referencia por `domain`, no por el archivo. El auditor exige que la ruta exista, igual
# que `files`. Un dominio que no expone HTTP no lo declara. /sdd-generate toma de ahi las
# firmas HTTP en vez de inventarlas; /sdd-e2e lo usa como oraculo de conformidad.
