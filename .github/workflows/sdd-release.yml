name: SDD Release

# Valida un release cuando se pushea un tag vX.Y.Z. NO publica a ningún registro
# de paquetes: la distribución es por repo (git / submódulo), en GitHub y GitLab,
# no por npm. Lo que este workflow hace es convertir "taggear" en un acto seguro:
# si las versiones no coinciden, si el manifiesto quedó viejo o si el árbol tiene
# drift, el tag falla ruidosamente y se ve que ese release no es consistente.
#
# NO es capa A: no está en contracts/framework-files.txt y no se materializa en
# ningún repo consumidor.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Un número, tres sistemas: el tag de git, la fuente única del framework
      # y la versión del paquete. Si divergen, .claude/VERSION va a decir una
      # cosa y el gate de los consumidores va a comparar contra otra.
      - name: Las tres versiones coinciden
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(tr -d ' \r\n' < .claude/VERSION)
          skills=$(tr -d ' \r\n' < .claude/skills/VERSION)
          pkg=$(node -p "require('./package.json').version")

          echo "tag=$tag  .claude/VERSION=$version  skills/VERSION=$skills  package.json=$pkg"

          if [ "$tag" != "$version" ] || [ "$version" != "$skills" ] || [ "$version" != "$pkg" ]; then
            echo "::error::las versiones no coinciden. Corré: node scripts/sdd-bump.mjs $tag"
            exit 1
          fi

      - name: El manifiesto está al día
        run: node scripts/sdd-manifest.mjs --check

      - name: El árbol está íntegro
        run: node scripts/sdd-verify.mjs --root .

      - name: Auditar consistencia del modelo
        run: pnpm audit:sdd
