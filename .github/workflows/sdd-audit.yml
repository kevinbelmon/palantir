name: SDD Audit

# Las dos verificaciones offline del framework, en cada PR:
#   sdd-verify   ¿los bytes de capa A son los de la versión que dice tener?
#   sdd-audit    ¿el modelo es internamente consistente?
#
# Este workflow se materializa en CADA repo consumidor, así que no puede asumir
# el gestor de paquetes: lo deduce del lockfile, igual que `sdd init`.
#
# Capa A: no se edita en destino.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilegio explícito: sin declararlo hereda el default de ESE repo,
# que puede ser write-all. Ninguno de los dos jobs escribe nada.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar el gestor de paquetes de este repo
        id: pm
        shell: bash
        run: |
          if   [ -f pnpm-lock.yaml ];    then echo "mgr=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ];         then echo "mgr=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then echo "mgr=npm"  >> "$GITHUB_OUTPUT"
          else                                echo "mgr=none" >> "$GITHUB_OUTPUT"
          fi

      # pnpm se instala con su action y versión pineada. `corepack enable pnpm`
      # trae la última, que sin campo `packageManager` en el package.json puede
      # no leer el lockfile de este repo — y en no interactivo eso falla seco.
      - if: steps.pm.outputs.mgr == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.mgr }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) corepack enable yarn && yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
            none) echo "::notice::sin lockfile — npm install"; npm install ;;
          esac

      # Los dos scripts se invocan con node, no con `pnpm audit:sdd`: el atajo
      # del package.json existe para las personas, no para el CI.
      - name: Integridad de la instalación (manifiesto vs. árbol)
        run: node scripts/sdd-verify.mjs --root .

      - name: Consistencia del modelo SDD
        run: node scripts/sdd-audit.mjs --root .

      # Solo upstream: sdd-selftest.mjs no se materializa en repos consumidores,
      # así que en ellos este paso no encuentra el archivo y se saltea.
      - name: Suite de distribución (solo en el repo del modelo)
        if: hashFiles('scripts/sdd-selftest.mjs') != ''
        run: node scripts/sdd-selftest.mjs --online

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita historial para escanear commits del PR

      - name: Escanear secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Publicación del estado ───────────────────────────────────────────────────
  # Sube metrics/estado.json al repo central para el tablero de proyectos.
  #
  # Tres decisiones que no son obvias:
  #
  # 1. Corre con `always()`, después del auditor y sin depender de que pase. Si
  #    solo publicara cuando todo está verde, el tablero mostraría únicamente los
  #    proyectos sanos — que es exactamente lo contrario de para qué sirve.
  #
  # 2. No falla nunca el build. Publicar es observabilidad, no un gate: que un
  #    repo no pueda reportar no es motivo para bloquear un merge.
  #
  # 3. Se saltea sola donde no está configurada. La variable SDD_ESTADO_REPO se
  #    define a nivel de organización o de repo; sin ella el job no hace nada, así
  #    que este archivo puede ser idéntico en todos los repos (capa A) y aun así
  #    solo publicar donde corresponde.
  #
  # Credenciales: SDD_ESTADO_TOKEN necesita permiso de escritura sobre el repo
  # central y nada más. Un PAT personal repartido en N repos son N lugares para
  # rotar y una filtración escribe en el central: conviene una GitHub App con
  # permiso acotado, que es una identidad sola y revocable de un lado.
  estado:
    needs: audit
    if: ${{ always() && github.event_name == 'push' && vars.SDD_ESTADO_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar el estado
        id: gen
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sdd-state.mjs
          # La ruta la calcula el script, que se niega si al registro le falta
          # identidad. Sin proyecto_id un archivo anónimo en el repo central no se
          # puede atribuir ni limpiar: mejor no publicar.
          echo "ruta=$(node scripts/sdd-state.mjs --publish-path)" >> "$GITHUB_OUTPUT"

      - name: Publicar
        if: steps.gen.outcome == 'success'
        shell: bash
        env:
          CENTRAL: ${{ vars.SDD_ESTADO_REPO }}
          TOKEN: ${{ secrets.SDD_ESTADO_TOKEN }}
          RUTA: ${{ steps.gen.outputs.ruta }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::SDD_ESTADO_TOKEN no configurado — no se publica"
            exit 0
          fi

          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${CENTRAL}.git" central
          destino="central/estado/${RUTA}"
          mkdir -p "$(dirname "$destino")"

          # Solo se commitea si cambió algo que no sea la marca de tiempo. Sin
          # esto cada corrida de CI dejaría un commit, y en un año el repo central
          # tendría decenas de miles por nada.
          if [ -f "$destino" ] && node -e '
            const fs = require("fs");
            const sin = (p) => { const o = JSON.parse(fs.readFileSync(p, "utf8")); delete o.generated; return JSON.stringify(o); };
            process.exit(sin(process.argv[1]) === sin(process.argv[2]) ? 0 : 1);
          ' "$destino" metrics/estado.json; then
            echo "::notice::el estado no cambió — no se commitea"
            exit 0
          fi

          cp metrics/estado.json "$destino"
          cd central
          git config user.name  "sdd-estado"
          git config user.email "sdd-estado@users.noreply.github.com"
          git add "estado/${RUTA}"
          git commit -m "estado: ${RUTA} desde ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"

          # Varios repos pueden estar publicando a la vez. Como cada uno escribe
          # su propio archivo no hay conflicto de contenido, solo de índice, y el
          # rebase lo resuelve.
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "::notice::push rechazado, reintento $intento"
            git pull --rebase --autostash
          done
          echo "::warning::no se pudo publicar el estado después de 3 intentos"
